name: test
on: [push, pull_request]
jobs:
  transformer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run async-transform tests
        run: python3 test/test_async_transform.py
